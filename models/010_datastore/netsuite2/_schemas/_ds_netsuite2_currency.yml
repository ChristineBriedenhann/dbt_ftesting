version: 2

models:
  - name: ds_netsuite2_currency
    description: |
      The ds_netsuite2_currency table stores transformed currency data from NetSuite for data synchronization and reporting purposes.
    columns:
      - name: ds_netsuite2_currency__key
        description: |
          Unique key for the currency record in the ds_netsuite2_currency table.
        data_type: number(18,0)
      
      - name: id
        description: |
          Identifier for the currency record.
        data_type: number(38,0)
      
      - name: _fivetran_deleted
        description: |
          Indicates if the record has been deleted by Fivetran.
        data_type: boolean
      
      - name: _fivetran_active
        description: |
          Indicates if the record is currently active in Fivetran.
        data_type: boolean
      
      - name: _fivetran_synced
        description: |
          Timestamp of the last successful sync by Fivetran.
        data_type: timestamp_ntz
      
      - name: _fivetran_start
        description: |
          Start time of the Fivetran sync process.
        data_type: timestamp_ntz
      
      - name: _fivetran_end
        description: |
          End time of the Fivetran sync process.
        data_type: timestamp_ntz
      
      - name: currencyformatsample
        description: |
          Sample format of the currency.
        data_type: varchar
      
      - name: date_deleted
        description: |
          Date when the currency record was deleted.
        data_type: number(38,0)
      
      - name: displaysymbol
        description: |
          Symbol used to display the currency.
        data_type: varchar
      
      - name: exchangerate
        description: |
          Exchange rate of the currency.
        data_type: number(18,6)
      
      - name: fxrateupdatetimezone
        description: |
          Timezone for the exchange rate update.
        data_type: varchar
      
      - name: includeinfxrateupdates
        description: |
          Indicates if the currency is included in exchange rate updates.
        data_type: varchar
      
      - name: isbasecurrency
        description: |
          Indicates if the currency is the base currency.
        data_type: varchar
      
      - name: isinactive
        description: |
          Indicates if the currency is inactive.
        data_type: varchar
      
      - name: lastmodifieddate
        description: |
          Date when the currency record was last modified.
        data_type: timestamp_ntz
      
      - name: name
        description: |
          Name of the currency.
        data_type: varchar
      
      - name: overridecurrencyformat
        description: |
          Override format for the currency.
        data_type: varchar
      
      - name: symbol
        description: |
          Symbol representing the currency.
        data_type: varchar
      
      - name: symbolplacement
        description: |
          Placement of the currency symbol.
        data_type: number(38,0)
      
      - name: _fivetran_synced_ltz
        description: |
          Last sync time by Fivetran in local timezone.
        data_type: timestamp_ntz
      
      - name: _fivetran_start_ltz
        description: |
          Start time of the Fivetran sync process in local timezone.
        data_type: timestamp_ntz
      
      - name: _fivetran_end_ltz
        description: |
          End time of the Fivetran sync process in local timezone.
        data_type: timestamp_ntz
      
      - name: dbt_start_date
        description: |
          Start date for the DBT model.
        data_type: timestamp_ntz
      
      - name: dbt_end_date
        description: |
          End date for the DBT model.
        data_type: timestamp_ntz
      
      - name: dbt_version
        description: |
          Version of the DBT model.
        data_type: number(18,0)
      
      - name: dbt_current_flag
        description: |
          Indicates if the record is current in the DBT model.
        data_type: varchar(1)
      
      - name: dbt_delete_flag
        description: |
          Indicates if the record is marked for deletion in the DBT model.
        data_type: varchar(1)
      
      - name: dbt_create_time
        description: |
          Time when the record was created in the DBT model.
        data_type: timestamp_ntz
      
      - name: dbt_update_time
        description: |
          Time when the record was last updated in the DBT model.
        data_type: timestamp_ntz