version: 2

sources:
  - name: netsuite2
    database: rogue_brigade_raw
    schema: netsuite2
    tables:
      - name: account
        description: |
          Stores the chart of accounts, including account types, hierarchy, and currency assignments.
        columns:
          - name: id
            description: |
              Unique identifier for the account record.
            data_type: number(38,0)
          
          - name: _fivetran_deleted
            description: |
              Fivetran soft-delete flag indicating the record has been deleted in the source.
            data_type: boolean
          
          - name: _fivetran_active
            description: |
              Fivetran flag indicating whether this is the currently active version of the record.
            data_type: boolean
          
          - name: _fivetran_synced
            description: |
              Timestamp when the record was last synced by Fivetran.
            data_type: timestamp_ntz
          
          - name: accountsearchdisplayname
            description: |
              Display name used in account search lookups.
            data_type: varchar
          
          - name: accountsearchdisplaynamecopy
            description: |
              Copy of the account search display name.
            data_type: varchar
          
          - name: acctnumber
            description: |
              Account number assigned in the chart of accounts.
            data_type: number(38,0)
          
          - name: accttype
            description: |
              Account type classification (e.g. Income, Expense, Asset, Liability).
            data_type: varchar
          
          - name: billableexpensesacct
            description: |
              Reference to the billable expenses account.
            data_type: number(38,0)
          
          - name: cashflowrate
            description: |
              Cash flow rate type used for currency consolidation.
            data_type: varchar
          
          - name: category1099misc
            description: |
              1099-MISC category reference for tax reporting.
            data_type: number(38,0)
          
          - name: class
            description: |
              Class segment reference for the account.
            data_type: number(38,0)
          
          - name: currency
            description: |
              Currency reference for the account.
            data_type: number(38,0)
          
          - name: custrecord_fam_account_showinfixedasset
            description: |
              Custom field indicating whether the account is shown in fixed asset management.
            data_type: varchar
          
          - name: date_deleted
            description: |
              Internal identifier for the deletion date record.
            data_type: number(38,0)
          
          - name: deferralacct
            description: |
              Reference to the deferral account.
            data_type: number(38,0)
          
          - name: department
            description: |
              Department segment reference for the account.
            data_type: number(38,0)
          
          - name: description
            description: |
              Description identifier for the account.
            data_type: number(38,0)
          
          - name: displaynamewithhierarchy
            description: |
              Full account name including parent hierarchy.
            data_type: varchar
          
          - name: externalid
            description: |
              External system identifier for integration purposes.
            data_type: varchar
          
          - name: fullname
            description: |
              Full hierarchical name of the account.
            data_type: varchar
          
          - name: generalrate
            description: |
              General rate type used for currency consolidation.
            data_type: varchar
          
          - name: includechildren
            description: |
              Flag indicating whether child accounts are included in reporting.
            data_type: varchar
          
          - name: inventory
            description: |
              Flag indicating whether this is an inventory account.
            data_type: varchar
          
          - name: isinactive
            description: |
              Flag indicating whether the account is inactive.
            data_type: varchar
          
          - name: issummary
            description: |
              Flag indicating whether the account is a summary (parent) account.
            data_type: varchar
          
          - name: lastmodifieddate
            description: |
              Timestamp when the account was last modified.
            data_type: timestamp_ntz
          
          - name: location
            description: |
              Location segment reference for the account.
            data_type: number(38,0)
          
          - name: parent
            description: |
              Reference to the parent account in the hierarchy.
            data_type: number(38,0)
          
          - name: reconcilewithmatching
            description: |
              Flag indicating whether the account uses reconciliation matching.
            data_type: varchar
          
          - name: revalue
            description: |
              Flag indicating whether the account is subject to revaluation.
            data_type: varchar
          
          - name: sbankname
            description: |
              Bank name reference for the account.
            data_type: number(38,0)
          
          - name: sbankroutingnumber
            description: |
              Bank routing number reference for the account.
            data_type: number(38,0)
          
          - name: sspecacct
            description: |
              Special account type indicator.
            data_type: varchar
          
          - name: subsidiary
            description: |
              Subsidiary assignment for the account.
            data_type: varchar
          
          - name: eliminate
            description: |
              Flag indicating whether the account is used for intercompany elimination.
            data_type: varchar

      - name: accounting_book
        description: |
          Stores accounting book definitions, including primary and secondary books used for multi-book accounting.
        columns:
          - name: id
            description: |
              Unique identifier for the accounting book record.
            data_type: number(38,0)
          
          - name: _fivetran_deleted
            description: |
              Fivetran soft-delete flag indicating the record has been deleted in the source.
            data_type: boolean
          
          - name: _fivetran_active
            description: |
              Fivetran flag indicating whether this is the currently active version of the record.
            data_type: boolean
          
          - name: _fivetran_synced
            description: |
              Timestamp when the record was last synced by Fivetran.
            data_type: timestamp_ntz
          
          - name: basebook
            description: |
              Reference to the base accounting book.
            data_type: number(38,0)
          
          - name: date_deleted
            description: |
              Internal identifier for the deletion date record.
            data_type: number(38,0)
          
          - name: effectiveperiod
            description: |
              Reference to the period when this book became effective.
            data_type: number(38,0)
          
          - name: externalid
            description: |
              External system identifier for integration purposes.
            data_type: number(38,0)
          
          - name: isadjustmentonly
            description: |
              Flag indicating whether the book is used only for adjustments.
            data_type: varchar
          
          - name: isconsolidated
            description: |
              Flag indicating whether the book is a consolidated book.
            data_type: varchar
          
          - name: isprimary
            description: |
              Flag indicating whether this is the primary accounting book.
            data_type: varchar
          
          - name: lastmodifieddate
            description: |
              Timestamp when the record was last modified.
            data_type: timestamp_ntz
          
          - name: name
            description: |
              Name of the accounting book.
            data_type: varchar
          
          - name: subsidiariesstring
            description: |
              Comma-separated list of subsidiary IDs associated with the book.
            data_type: varchar

      - name: accounting_book_subsidiaries
        description: |
          Maps accounting books to their associated subsidiaries and tracks status.
        columns:
          - name: _fivetran_id
            description: |
              Fivetran-generated unique identifier for the record.
            data_type: varchar
          
          - name: _fivetran_deleted
            description: |
              Fivetran soft-delete flag indicating the record has been deleted in the source.
            data_type: boolean
          
          - name: _fivetran_synced
            description: |
              Timestamp when the record was last synced by Fivetran.
            data_type: timestamp_ntz
          
          - name: accountingbook
            description: |
              Reference to the accounting book.
            data_type: number(38,0)
          
          - name: date_deleted
            description: |
              Internal identifier for the deletion date record.
            data_type: number(38,0)
          
          - name: status
            description: |
              Status of the accounting book for the subsidiary.
            data_type: varchar
          
          - name: subsidiary
            description: |
              Reference to the subsidiary.
            data_type: number(38,0)

      - name: accounting_period
        description: |
          Stores accounting periods including months, quarters, and years, with locking and closing status.
        columns:
          - name: id
            description: |
              Unique identifier for the accounting period record.
            data_type: number(38,0)
          
          - name: _fivetran_deleted
            description: |
              Fivetran soft-delete flag indicating the record has been deleted in the source.
            data_type: boolean
          
          - name: _fivetran_active
            description: |
              Fivetran flag indicating whether this is the currently active version of the record.
            data_type: boolean
          
          - name: _fivetran_synced
            description: |
              Timestamp when the record was last synced by Fivetran.
            data_type: timestamp_ntz
          
          - name: _fivetran_start
            description: |
              Fivetran history mode start timestamp for this version of the record.
            data_type: timestamp_ntz
          
          - name: _fivetran_end
            description: |
              Fivetran history mode end timestamp for this version of the record.
            data_type: timestamp_ntz
          
          - name: alllocked
            description: |
              Flag indicating whether all transaction types are locked for this period.
            data_type: varchar
          
          - name: allownonglchanges
            description: |
              Flag indicating whether non-GL changes are allowed in this period.
            data_type: varchar
          
          - name: aplocked
            description: |
              Flag indicating whether accounts payable is locked for this period.
            data_type: varchar
          
          - name: arlocked
            description: |
              Flag indicating whether accounts receivable is locked for this period.
            data_type: varchar
          
          - name: closed
            description: |
              Flag indicating whether the period is closed.
            data_type: varchar
          
          - name: closedondate
            description: |
              Date when the period was closed.
            data_type: timestamp_ntz
          
          - name: date_deleted
            description: |
              Internal identifier for the deletion date record.
            data_type: number(38,0)
          
          - name: enddate
            description: |
              End date of the accounting period.
            data_type: timestamp_ntz
          
          - name: isadjust
            description: |
              Flag indicating whether this is an adjustment period.
            data_type: varchar
          
          - name: isinactive
            description: |
              Flag indicating whether the period is inactive.
            data_type: varchar
          
          - name: isposting
            description: |
              Flag indicating whether the period allows posting.
            data_type: varchar
          
          - name: isquarter
            description: |
              Flag indicating whether the period represents a quarter.
            data_type: varchar
          
          - name: isyear
            description: |
              Flag indicating whether the period represents a full year.
            data_type: varchar
          
          - name: lastmodifieddate
            description: |
              Timestamp when the record was last modified.
            data_type: timestamp_ntz
          
          - name: parent
            description: |
              Reference to the parent period (e.g. quarter for a month).
            data_type: number(38,0)
          
          - name: periodname
            description: |
              Display name of the accounting period.
            data_type: varchar
          
          - name: startdate
            description: |
              Start date of the accounting period.
            data_type: timestamp_ntz

      - name: accounting_period_fiscal_calendars
        description: |
          Maps accounting periods to fiscal calendars and their parent period relationships.
        columns:
          - name: _fivetran_id
            description: |
              Fivetran-generated unique identifier for the record.
            data_type: varchar
          
          - name: _fivetran_deleted
            description: |
              Fivetran soft-delete flag indicating the record has been deleted in the source.
            data_type: boolean
          
          - name: _fivetran_synced
            description: |
              Timestamp when the record was last synced by Fivetran.
            data_type: timestamp_ntz
          
          - name: accountingperiod
            description: |
              Reference to the accounting period.
            data_type: number(38,0)
          
          - name: date_deleted
            description: |
              Internal identifier for the deletion date record.
            data_type: number(38,0)
          
          - name: fiscalcalendar
            description: |
              Reference to the fiscal calendar.
            data_type: number(38,0)
          
          - name: parent
            description: |
              Reference to the parent period within the fiscal calendar.
            data_type: number(38,0)

      - name: account_type
        description: |
          Stores account type definitions used to classify accounts in the chart of accounts.
        columns:
          - name: id
            description: |
              Unique identifier for the account type record.
            data_type: varchar
          
          - name: _fivetran_deleted
            description: |
              Fivetran soft-delete flag indicating the record has been deleted in the source.
            data_type: boolean
          
          - name: _fivetran_synced
            description: |
              Timestamp when the record was last synced by Fivetran.
            data_type: timestamp_ntz
          
          - name: balancesheet
            description: |
              Flag indicating whether this account type appears on the balance sheet.
            data_type: varchar
          
          - name: date_deleted
            description: |
              Internal identifier for the deletion date record.
            data_type: number(38,0)
          
          - name: defaultcashflowratetype
            description: |
              Default cash flow rate type for currency consolidation.
            data_type: varchar
          
          - name: defaultgeneralratetype
            description: |
              Default general rate type for currency consolidation.
            data_type: varchar
          
          - name: eliminationalgo
            description: |
              Elimination algorithm used for intercompany transactions.
            data_type: varchar
          
          - name: includeinrevaldefault
            description: |
              Default flag for including in currency revaluation.
            data_type: varchar
          
          - name: internalid
            description: |
              Internal numeric identifier for the account type.
            data_type: number(38,0)
          
          - name: left
            description: |
              Indicates whether this account type has a normal left (debit) balance.
            data_type: varchar
          
          - name: longname
            description: |
              Full descriptive name of the account type.
            data_type: varchar
          
          - name: seqnum
            description: |
              Sequence number controlling display order.
            data_type: number(38,0)
          
          - name: usercanchangerevaloption
            description: |
              Flag indicating whether users can change the revaluation option.
            data_type: varchar

      - name: classification
        description: |
          Stores classification (class) segment values used for transaction categorization.
        columns:
          - name: id
            description: |
              Unique identifier for the classification record.
            data_type: number(38,0)
          
          - name: _fivetran_deleted
            description: |
              Fivetran soft-delete flag indicating the record has been deleted in the source.
            data_type: boolean
          
          - name: _fivetran_active
            description: |
              Fivetran flag indicating whether this is the currently active version of the record.
            data_type: boolean
          
          - name: _fivetran_synced
            description: |
              Timestamp when the record was last synced by Fivetran.
            data_type: timestamp_ntz
          
          - name: date_deleted
            description: |
              Internal identifier for the deletion date record.
            data_type: number(38,0)
          
          - name: externalid
            description: |
              External system identifier for integration purposes.
            data_type: varchar
          
          - name: fullname
            description: |
              Full hierarchical name of the classification.
            data_type: varchar
          
          - name: includechildren
            description: |
              Flag indicating whether child classifications are included in reporting.
            data_type: varchar
          
          - name: isinactive
            description: |
              Flag indicating whether the classification is inactive.
            data_type: varchar
          
          - name: lastmodifieddate
            description: |
              Timestamp when the record was last modified.
            data_type: timestamp_ntz
          
          - name: name
            description: |
              Name of the classification.
            data_type: varchar
          
          - name: parent
            description: |
              Reference to the parent classification in the hierarchy.
            data_type: number(38,0)
          
          - name: subsidiary
            description: |
              Subsidiary assignment for the classification.
            data_type: varchar

      - name: consolidated_exchange_rate
        description: |
          Stores consolidated exchange rates between subsidiaries for different accounting books and periods.
        columns:
          - name: id
            description: |
              Unique identifier for the consolidated exchange rate record.
            data_type: number(38,0)
          
          - name: _fivetran_deleted
            description: |
              Fivetran soft-delete flag indicating the record has been deleted in the source.
            data_type: boolean
          
          - name: _fivetran_synced
            description: |
              Timestamp when the record was last synced by Fivetran.
            data_type: timestamp_ntz
          
          - name: accountingbook
            description: |
              Reference to the accounting book.
            data_type: number(38,0)
          
          - name: averagerate
            description: |
              Average exchange rate for the period.
            data_type: number(18,6)
          
          - name: currentrate
            description: |
              Current (spot) exchange rate at period end.
            data_type: number(18,6)
          
          - name: date_deleted
            description: |
              Internal identifier for the deletion date record.
            data_type: number(38,0)
          
          - name: fromcurrency
            description: |
              Source currency reference for the exchange rate.
            data_type: number(38,0)
          
          - name: fromsubsidiary
            description: |
              Source subsidiary reference for the exchange rate.
            data_type: number(38,0)
          
          - name: historicalrate
            description: |
              Historical exchange rate for the period.
            data_type: number(18,6)
          
          - name: postingperiod
            description: |
              Reference to the posting period for the exchange rate.
            data_type: number(38,0)
          
          - name: tocurrency
            description: |
              Target currency reference for the exchange rate.
            data_type: number(38,0)
          
          - name: tosubsidiary
            description: |
              Target subsidiary reference for the exchange rate.
            data_type: number(38,0)

      - name: currency
        description: |
          Stores currency definitions including symbols, exchange rates, and formatting preferences.
        columns:
          - name: id
            description: |
              Unique identifier for the currency record.
            data_type: number(38,0)
          
          - name: _fivetran_deleted
            description: |
              Fivetran soft-delete flag indicating the record has been deleted in the source.
            data_type: boolean
          
          - name: _fivetran_active
            description: |
              Fivetran flag indicating whether this is the currently active version of the record.
            data_type: boolean
          
          - name: _fivetran_synced
            description: |
              Timestamp when the record was last synced by Fivetran.
            data_type: timestamp_ntz
          
          - name: _fivetran_start
            description: |
              Fivetran history mode start timestamp for this version of the record.
            data_type: timestamp_ntz
          
          - name: _fivetran_end
            description: |
              Fivetran history mode end timestamp for this version of the record.
            data_type: timestamp_ntz
          
          - name: currencyformatsample
            description: |
              Sample format string showing how the currency is displayed.
            data_type: varchar
          
          - name: date_deleted
            description: |
              Internal identifier for the deletion date record.
            data_type: number(38,0)
          
          - name: displaysymbol
            description: |
              Symbol displayed in the user interface for the currency.
            data_type: varchar
          
          - name: exchangerate
            description: |
              Default exchange rate relative to the base currency.
            data_type: number(18,6)
          
          - name: fxrateupdatetimezone
            description: |
              Timezone used for exchange rate updates.
            data_type: varchar
          
          - name: includeinfxrateupdates
            description: |
              Flag indicating whether this currency is included in automatic rate updates.
            data_type: varchar
          
          - name: isbasecurrency
            description: |
              Flag indicating whether this is the base currency.
            data_type: varchar
          
          - name: isinactive
            description: |
              Flag indicating whether the currency is inactive.
            data_type: varchar
          
          - name: lastmodifieddate
            description: |
              Timestamp when the record was last modified.
            data_type: timestamp_ntz
          
          - name: name
            description: |
              Name of the currency (e.g. US Dollar, Euro).
            data_type: varchar
          
          - name: overridecurrencyformat
            description: |
              Flag indicating whether the default currency format is overridden.
            data_type: varchar
          
          - name: symbol
            description: |
              Currency symbol (e.g. $, EUR).
            data_type: varchar
          
          - name: symbolplacement
            description: |
              Position of the symbol relative to the amount.
            data_type: number(38,0)

      - name: customer
        description: |
          Stores customer records including company details, creation dates, and subsidiary assignments.
        columns:
          - name: id
            description: |
              Unique identifier for the customer record.
            data_type: number(38,0)
          
          - name: _fivetran_deleted
            description: |
              Fivetran soft-delete flag indicating the record has been deleted in the source.
            data_type: boolean
          
          - name: _fivetran_active
            description: |
              Fivetran flag indicating whether this is the currently active version of the record.
            data_type: boolean
          
          - name: _fivetran_synced
            description: |
              Timestamp when the record was last synced by Fivetran.
            data_type: timestamp_ntz
          
          - name: companyname
            description: |
              Company name of the customer.
            data_type: varchar
          
          - name: datecreated
            description: |
              Timestamp when the customer record was created.
            data_type: timestamp_ntz
          
          - name: date_deleted
            description: |
              Internal identifier for the deletion date record.
            data_type: number(38,0)
          
          - name: entityid
            description: |
              Entity identifier or customer number.
            data_type: varchar
          
          - name: externalid
            description: |
              External system identifier for integration purposes.
            data_type: varchar
          
          - name: firstorderdate
            description: |
              Reference to the date of the customer's first order.
            data_type: number(38,0)
          
          - name: isinactive
            description: |
              Flag indicating whether the customer is inactive.
            data_type: varchar
          
          - name: isperson
            description: |
              Flag indicating whether the customer is an individual person rather than a company.
            data_type: varchar
          
          - name: lastmodifieddate
            description: |
              Timestamp when the customer record was last modified.
            data_type: timestamp_ntz
          
          - name: parent
            description: |
              Reference to the parent customer in the hierarchy.
            data_type: number(38,0)
          
          - name: subsidiary
            description: |
              Primary subsidiary reference for the customer.
            data_type: number(38,0)

      - name: customer_subsidiary_relationship
        description: |
          Maps customers to their associated subsidiaries, identifying primary subsidiary assignments.
        columns:
          - name: id
            description: |
              Unique identifier for the relationship record.
            data_type: number(38,0)
          
          - name: _fivetran_deleted
            description: |
              Fivetran soft-delete flag indicating the record has been deleted in the source.
            data_type: boolean
          
          - name: _fivetran_active
            description: |
              Fivetran flag indicating whether this is the currently active version of the record.
            data_type: boolean
          
          - name: _fivetran_synced
            description: |
              Timestamp when the record was last synced by Fivetran.
            data_type: timestamp_ntz
          
          - name: date_deleted
            description: |
              Internal identifier for the deletion date record.
            data_type: number(38,0)
          
          - name: entity
            description: |
              Reference to the customer entity.
            data_type: number(38,0)
          
          - name: isprimarysub
            description: |
              Flag indicating whether this is the primary subsidiary for the customer.
            data_type: boolean
          
          - name: subsidiary
            description: |
              Reference to the subsidiary.
            data_type: number(38,0)

      - name: department
        description: |
          Stores department segment values used for organizational categorization of transactions.
        columns:
          - name: id
            description: |
              Unique identifier for the department record.
            data_type: number(38,0)
          
          - name: _fivetran_deleted
            description: |
              Fivetran soft-delete flag indicating the record has been deleted in the source.
            data_type: boolean
          
          - name: _fivetran_active
            description: |
              Fivetran flag indicating whether this is the currently active version of the record.
            data_type: boolean
          
          - name: _fivetran_synced
            description: |
              Timestamp when the record was last synced by Fivetran.
            data_type: timestamp_ntz
          
          - name: date_deleted
            description: |
              Internal identifier for the deletion date record.
            data_type: number(38,0)
          
          - name: externalid
            description: |
              External system identifier for integration purposes.
            data_type: varchar
          
          - name: fullname
            description: |
              Full hierarchical name of the department.
            data_type: varchar
          
          - name: includechildren
            description: |
              Flag indicating whether child departments are included in reporting.
            data_type: varchar
          
          - name: isinactive
            description: |
              Flag indicating whether the department is inactive.
            data_type: varchar
          
          - name: lastmodifieddate
            description: |
              Timestamp when the record was last modified.
            data_type: timestamp_ntz
          
          - name: name
            description: |
              Name of the department.
            data_type: varchar
          
          - name: parent
            description: |
              Reference to the parent department in the hierarchy.
            data_type: number(38,0)
          
          - name: subsidiary
            description: |
              Subsidiary assignment for the department.
            data_type: varchar

      - name: employee
        description: |
          Stores employee records including personal details, department assignments, and employment dates.
        columns:
          - name: id
            description: |
              Unique identifier for the employee record.
            data_type: number(38,0)
          
          - name: _fivetran_deleted
            description: |
              Fivetran soft-delete flag indicating the record has been deleted in the source.
            data_type: boolean
          
          - name: _fivetran_active
            description: |
              Fivetran flag indicating whether this is the currently active version of the record.
            data_type: boolean
          
          - name: _fivetran_synced
            description: |
              Timestamp when the record was last synced by Fivetran.
            data_type: timestamp_ntz
          
          - name: approvallimit
